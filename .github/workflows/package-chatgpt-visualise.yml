name: Package ChatGPT Visualise Skill
on:
  push:
    branches: [main]
    paths:
      - 'chatgpt-visualise/**'
      - '.github/workflows/package-chatgpt-visualise.yml'
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skill and examples
        run: |
          python3 chatgpt-visualise/scripts/lint_visual.py chatgpt-visualise/assets/cache-hit-demo.html chatgpt-visualise/assets/example-dataflow.svg
          python3 -c 'from pathlib import Path; p=Path("chatgpt-visualise"); assert (p/"SKILL.md").exists(); assert len(list(p.rglob("*.md")))>=10'
      - name: Package
        run: zip -qr skill.zip chatgpt-visualise
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-visualise-skill
          path: skill.zip
