<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cache hit-rate micro-demo</title><style>body{font:16px system-ui,sans-serif;background:#f7fafc;color:#17212e;max-width:740px;margin:35px auto;padding:18px}main{border:1px solid #b8cbd4;background:#fff;border-radius:12px;padding:25px}label{display:block;margin:18px 0 6px}input{width:100%}.bar{height:28px;background:#e3edf1;border-radius:8px;overflow:hidden}.fill{height:100%;background:#0f8970;width:50%;transition:width .1s}button{padding:9px 18px;margin-top:20px}output{font-variant-numeric:tabular-nums;font-size:23px}</style><main><h1>Cache hit-rate</h1><p>Adjust the simulated cache hit rate. Every displayed value updates from a single input.</p><label for="hit">Cache hits: <span id="value">50%</span></label><input id="hit" type="range" min="0" max="100" value="50"><div class="bar" aria-hidden="true"><div class="fill" id="fill"></div></div><p>Hits in 1,000 requests: <output id="hits">500</output></p><p>Misses: <output id="misses">500</output></p><button id="reset">Reset</button><p><small>Illustrative example; not measurements from a real server.</small></p></main><script>const s=document.getElementById('hit');function render(){const h=+s.value;document.getElementById('value').textContent=h+'%';document.getElementById('fill').style.width=h+'%';document.getElementById('hits').textContent=10*h;document.getElementById('misses').textContent=1000-10*h;}s.addEventListener('input',render);document.getElementById('reset').addEventListener('click',()=>{s.value=50;render()});render()</script></html>
